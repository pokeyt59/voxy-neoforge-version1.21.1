plugins {
    id 'net.neoforged.gradle.userdev' version "${neo_gradle_version}"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Optional: Parchment adds parameter names on top of Mojang official mappings
subsystems {
    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }
}

// Register access transformer
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        workingDirectory project.file('run')
        // JDWP open, no suspend — attach IntelliJ to localhost:5005 if you want
        // live breakpoints / expression eval. Safe to leave on; only listens.
        jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
    }
    server {
        workingDirectory project.file('run-server')
        programArgument '--nogui'
    }
}

// ── ASM version alignment ───────────────────────────────────────────────────
// NGP 7.0.145 pulls net.neoforged:mergetool:2.0.3 transitively via
// neoGradleInternalUnhandledNeoFormMinecraftDependenciesFor*, which drags in
// raw ASM 9.5. The runClient classpath then conflicts with NeoForge's
// bootstrap module-path ASM 9.7. Force every org.ow2.asm artifact to 9.7
// across all configurations to match NeoForge.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion '9.7'
            details.because 'NeoForge 21.1.172 bootstrap requires ASM 9.7; mergetool 2.0.3 still requests 9.5'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    maven {
        name = "DevAuth"
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }
    mavenCentral()
}

// ── git commit hash helper ──────────────────────────────────────────────────

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }
        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>"
        } else {
            return result.standardOutput.asText.get().strip()
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>"
    }
}

configurations {
    bundledLibs {
        canBeResolved = true
        canBeConsumed = false
        transitive = false   // bundle exactly the artifacts we list
    }
    lwjglNatives {
        canBeResolved = true
        canBeConsumed = false
        // Without `transitive = false`, gradle pulls lwjgl-core natives as a
        // transitive of lwjgl-zstd / lwjgl-lmdb. Their jars contain
        // `org.lwjgl.system.linux` classes — extracting those into voxy's
        // resources makes voxy's module export that package, conflicting with
        // the `org.lwjgl` module already on the boot classpath.
        transitive = false
    }
}

processResources {
    def hash = gitCommitHash()
    def ver  = project.version
    inputs.properties("version": ver, "commit": hash)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": ver, "commit": hash
    }

    // Stage bundled libs (rocksdbjni, jedis, lz4, …) into META-INF/jarjar/ so
    // both dev runs (FML userdev locator) and the main production jar see them.
    // NGP's `jarJar` config alone only bundles into the `-all` classifier jar
    // and leaves dev runtime blind to these libs — see stageBundledLibs below.
    dependsOn 'stageBundledLibs', 'generateBundledLibsMetadata'
    from(layout.buildDirectory.dir('bundledLibsStage'))

    // Extract LWJGL native libs (lwjgl_zstd.dll, lwjgl_lmdb.dll, …) at their
    // standard `<os>/<arch>/org/lwjgl/...` paths inside voxy's resources so
    // the bundled lwjgl-zstd / lwjgl-lmdb modules find their .dll/.so via
    // classpath scan. Production's `jar { from zipTree(lwjglNatives) }` block
    // does the same merge for the shipped jar; this line gives dev runs the
    // same layout. Without this: UnsatisfiedLinkError at first compression op.
    //
    // Wrapped in a Closure (`{ ... }`) so the configuration is resolved at
    // task-execution time, not at script-config time — dependencies are still
    // being declared further down the script when this `from` is parsed.
    from({ configurations.lwjglNatives.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ── jarJar / bundled libraries ──────────────────────────────────────────────
// We bundle pure-Java libs ourselves (instead of relying on NGP's jarJar
// config) so dev runs can resolve them. NeoForge's userdev locator scans the
// mod source's META-INF/jarjar/ for bundled deps — no `META-INF/jarjar/` =
// no rocksdb visible to voxy's mod module, even with `implementation`.

// TODO: filter RocksDB natives down to win/linux x64 — see original Loom
// implementation. Skipped for now to keep the build green.

// ── dependencies ────────────────────────────────────────────────────────────
// (`bundledLibs` and `lwjglNatives` configurations are declared above
// processResources so its `from(configurations.lwjglNatives...)` resolves.)

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // ── Mod dependencies ────────────────────────────────────────────────────
    // Sodium NeoForge — same Modrinth slug, different classifier
    // TODO: verify exact NeoForge artifact version string on Modrinth
    compileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    if (!isInGHA) runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"

    // Lithium NeoForge
    // TODO: verify version string on Modrinth
    implementation "maven.modrinth:lithium:mc1.21.1-0.15.0-neoforge"

    // Iris NeoForge
    // TODO: verify version string on Modrinth
    compileOnly "maven.modrinth:iris:1.8.8+1.21.1-neoforge"
    if (!isInGHA) runtimeOnly "maven.modrinth:iris:1.8.8+1.21.1-neoforge"

    // Chunky NeoForge
    // TODO: verify version string on Modrinth
    compileOnly "maven.modrinth:chunky:1.4.23-neoforge"
    if (!isInGHA) runtimeOnly "maven.modrinth:chunky:1.4.23-neoforge"

    // Vivecraft NeoForge — check if a NeoForge build exists for 1.21.1
    // compileOnly "maven.modrinth:vivecraft:1.21.1-1.1.14-b2-neoforge"

    // Flashback — Fabric-only, no NeoForge port; compat code has been stubbed out
    // compileOnly "maven.modrinth:flashback:rNCr1Rbs"

    // Nvidium — Fabric-only, no NeoForge port; mixin removed
    // compileOnly "drouarb:nvidium:0.4.1-beta9:1.21-1.21.1@jar"

    // Spark NeoForge (runtime only)
    if (!isInGHA) runtimeOnly "maven.modrinth:spark:1.10.139-neoforge"

    // DevAuth
    if (!isInGHA) {
        runtimeOnly('me.djtheredstoner:DevAuth-neoforge:1.2.2') {
            exclude group: 'net.neoforged', module: 'neoforge'
        }
    }

    // ── Bundled libraries ───────────────────────────────────────────────────
    // Pure-Java libs needed at runtime by voxy. Declared in two configs:
    //   - `compileOnly`: compile classpath only (NOT runtime — see below)
    //   - `bundledLibs`: physically copied into META-INF/jarjar/ in the
    //                    resources output so FML treats them as bundled
    //                    (works in both dev and production)
    // We deliberately do NOT use `implementation` here. `implementation` puts
    // these libs on the gradle runtime classpath, which NeoForge loads as
    // automatic modules in the BOOT layer. Voxy then ALSO bundles them as
    // jar-in-jar — same module name in two layers → JPMS resolution failure
    // ("Module X reads more than one module named …"). Compile-time view
    // comes from `compileOnly`; runtime comes from META-INF/jarjar/ only.
    // LWJGL native jars stay on `runtimeOnly` for dev; production native
    // bundling is handled by the `jar { from(...) }` block further below.

    def lwjglVersion = "3.3.3"

    def bundledArtifacts = [
        "org.lwjgl:lwjgl-lmdb:${lwjglVersion}",
        "org.lwjgl:lwjgl-zstd:${lwjglVersion}",
        'redis.clients:jedis:5.1.0',
        'org.rocksdb:rocksdbjni:10.2.1',
        'org.apache.commons:commons-pool2:2.12.0',
        'org.tukaani:xz:1.10',
    ]
    bundledArtifacts.each { artifact ->
        compileOnly(artifact)
        bundledLibs(artifact)
    }

    // lz4-java is a transitive of NeoForge itself — already loaded as an
    // automatic module at runtime. Bundling it in voxy's META-INF/jarjar/
    // produces "Module X reads more than one module named org.lz4.java" when
    // iris's bundled glsl-transformer/jcpp resolve their `requires
    // org.lz4.java`. Use NeoForge's copy at runtime; declare compileOnly so
    // voxy's source can still reference the API.
    compileOnly('org.lz4:lz4-java:1.8.0')

    // LWJGL natives — runtime-only for dev; production bundling is the
    // `jar { from(configurations.lwjglNatives.collect { ... }) }` block.
    runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-linux"

    // Same natives, but on the `lwjglNatives` configuration so processResources
    // and the production jar task can extract them at standard paths into the
    // mod's resources. processResources resolves this configuration at config
    // time, so the deps must be added here (in the same `dependencies` block,
    // before the processResources reference fires) rather than in a later block.
    lwjglNatives "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-linux"

    // SQLite: bundle for production, runtime-only for dev.
    if (isInGHA) {
        compileOnly('org.xerial:sqlite-jdbc:3.49.1.0')
        bundledLibs('org.xerial:sqlite-jdbc:3.49.1.0')
    } else {
        runtimeOnly('org.xerial:sqlite-jdbc:3.49.1.0')
    }
}

// ── LWJGL native bundling ───────────────────────────────────────────────────
// Pull the native jars out of the runtime classpath and merge their contents
// into the final mod jar so end users don't need to install them separately.
// (The `lwjglNatives` configuration is declared up top alongside `bundledLibs`
// so processResources can extract the natives into resources/main.)

// ── Tasks: stage bundled libs into META-INF/jarjar/ ──────────────────────────
// Resolve every artifact in the `bundledLibs` configuration and write them
// (plus a metadata.json that mirrors NGP's format) into a staging dir, which
// processResources then merges into build/resources/main. End result: the mod
// source's META-INF/jarjar/ has metadata.json + lib jars, exactly the layout
// FML's userdev locator expects.

tasks.register('stageBundledLibs', Copy) {
    from configurations.bundledLibs
    into layout.buildDirectory.dir('bundledLibsStage/META-INF/jarjar')
}

tasks.register('generateBundledLibsMetadata') {
    def metadataFile = layout.buildDirectory.file('bundledLibsStage/META-INF/jarjar/metadata.json')
    outputs.file(metadataFile)
    inputs.files(configurations.bundledLibs)
    doLast {
        def jars = configurations.bundledLibs.resolvedConfiguration.resolvedArtifacts.collect { a ->
            def id = a.moduleVersion.id
            [
                identifier: [group: id.group, artifact: id.name],
                version: [range: "[${id.version},)", artifactVersion: id.version],
                path: "META-INF/jarjar/${a.file.name}",
                isObfuscated: false,
            ]
        }
        def file = metadataFile.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars]))
    }
}

// ── Compilation ──────────────────────────────────────────────────────────────

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    // Merge LWJGL native jar contents into the mod jar
    from(configurations.lwjglNatives.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}