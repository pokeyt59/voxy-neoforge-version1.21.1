plugins {
    id 'net.neoforged.gradle.userdev' version "${neo_gradle_version}"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Optional: Parchment adds parameter names on top of Mojang official mappings
subsystems {
    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }
}

// Register access transformer
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        workingDirectory project.file('run')
    }
    server {
        workingDirectory project.file('run-server')
        programArgument '--nogui'
    }
}

// ── ASM version alignment ───────────────────────────────────────────────────
// NGP 7.0.145 pulls net.neoforged:mergetool:2.0.3 transitively via
// neoGradleInternalUnhandledNeoFormMinecraftDependenciesFor*, which drags in
// raw ASM 9.5. The runClient classpath then conflicts with NeoForge's
// bootstrap module-path ASM 9.7. Force every org.ow2.asm artifact to 9.7
// across all configurations to match NeoForge.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion '9.7'
            details.because 'NeoForge 21.1.172 bootstrap requires ASM 9.7; mergetool 2.0.3 still requests 9.5'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    maven {
        name = "DevAuth"
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }
    mavenCentral()
}

// ── git commit hash helper ──────────────────────────────────────────────────

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }
        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>"
        } else {
            return result.standardOutput.asText.get().strip()
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>"
    }
}

processResources {
    def hash = gitCommitHash()
    def ver  = project.version
    inputs.properties("version": ver, "commit": hash)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": ver, "commit": hash
    }
}

// ── jarJar (jar-in-jar bundling) ────────────────────────────────────────────
// jarJar is enabled by default in NGP 7.x — no `jarJar.enable()` needed.

// TODO: filter RocksDB natives down to win/linux x64 — see original Loom
// implementation. Skipped for now to keep the build green.

// ── dependencies ────────────────────────────────────────────────────────────

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // ── Mod dependencies ────────────────────────────────────────────────────
    // Sodium NeoForge — same Modrinth slug, different classifier
    // TODO: verify exact NeoForge artifact version string on Modrinth
    compileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    if (!isInGHA) runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"

    // Lithium NeoForge
    // TODO: verify version string on Modrinth
    implementation "maven.modrinth:lithium:mc1.21.1-0.15.0-neoforge"

    // Iris NeoForge
    // TODO: verify version string on Modrinth
    compileOnly "maven.modrinth:iris:1.8.8+1.21.1-neoforge"
    if (!isInGHA) runtimeOnly "maven.modrinth:iris:1.8.8+1.21.1-neoforge"

    // Chunky NeoForge
    // TODO: verify version string on Modrinth
    compileOnly "maven.modrinth:chunky:1.4.23-neoforge"
    if (!isInGHA) runtimeOnly "maven.modrinth:chunky:1.4.23-neoforge"

    // Vivecraft NeoForge — check if a NeoForge build exists for 1.21.1
    // compileOnly "maven.modrinth:vivecraft:1.21.1-1.1.14-b2-neoforge"

    // Flashback — Fabric-only, no NeoForge port; compat code has been stubbed out
    // compileOnly "maven.modrinth:flashback:rNCr1Rbs"

    // Nvidium — Fabric-only, no NeoForge port; mixin removed
    // compileOnly "drouarb:nvidium:0.4.1-beta9:1.21-1.21.1@jar"

    // Spark NeoForge (runtime only)
    if (!isInGHA) runtimeOnly "maven.modrinth:spark:1.10.139-neoforge"

    // DevAuth
    if (!isInGHA) {
        runtimeOnly('me.djtheredstoner:DevAuth-neoforge:1.2.2') {
            exclude group: 'net.neoforged', module: 'neoforge'
        }
    }

    // ── Bundled libraries (jarJar) ──────────────────────────────────────────
    // NeoForge's jarJar does not accept classifier dependencies (e.g. natives).
    // Strategy:
    //   - Pure-Java libs: declare via `jarJar` so they get bundled in the mod jar.
    //   - LWJGL native jars: declared as `runtimeOnly` for dev; bundled into the
    //     mod jar via the bundleNatives copy-into-jar logic below.

    def lwjglVersion = "3.3.3"

    // LWJGL extras (lmdb + zstd are NOT bundled with vanilla Minecraft)
    jarJar(implementation("org.lwjgl:lwjgl-lmdb:${lwjglVersion}"))
    jarJar(implementation("org.lwjgl:lwjgl-zstd:${lwjglVersion}"))

    // Natives — runtime-only for the dev environment; production bundling
    // is handled by the `jar { from(...) }` block at the bottom of this file.
    runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-linux"

    jarJar(implementation('redis.clients:jedis:5.1.0'))
    jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0'))
    jarJar(implementation('org.lz4:lz4-java:1.8.0'))
    jarJar(implementation('org.tukaani:xz:1.10'))

    // SQLite: bundle for production, runtime-only for dev
    if (isInGHA) {
        jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))
    } else {
        runtimeOnly('org.xerial:sqlite-jdbc:3.49.1.0')
    }
}

// ── LWJGL native bundling ───────────────────────────────────────────────────
// Pull the native jars out of the runtime classpath and merge their contents
// into the final mod jar so end users don't need to install them separately.

configurations {
    lwjglNatives {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    lwjglNatives "org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl-zstd:3.3.3:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl-zstd:3.3.3:natives-linux"
}

// ── Compilation ──────────────────────────────────────────────────────────────

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    // Merge LWJGL native jar contents into the mod jar
    from(configurations.lwjglNatives.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}